services:
  app:
    build: .
    image: people-directory
    ports:
      - '7777:7777'
    environment:
      NODE_ENV: production
      PORT: 7777
      DB_PATH: /data/presight.db
      SEED_USER_COUNT: 10000
    volumes:
      - directory-data:/data
    restart: unless-stopped

volumes:
  directory-data:
