services:
  app:
    build: .
    image: ${IMAGE:-people-directory:local}
    ports:
      - '${HOST_PORT:-7777}:7777'
    environment:
      NODE_ENV: production
      PORT: 7777
      DB_PATH: /data/presight.db
      SEED_USER_COUNT: 10000
      SEED_ON_START: ${SEED_ON_START:-if-empty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    volumes:
      - directory-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7777/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  directory-data:
